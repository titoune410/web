<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<title>Todo List</title>
	<script>
		function todoApp() {
			return {
				taches: JSON.parse(localStorage.getItem('taches')) || [],
				nouvelle: '',
				darkMode: localStorage.getItem('theme') === 'dark',
				dyslexie: localStorage.getItem('dyslexie') === 'true',

				init() {
					this.$watch('taches', v => localStorage.setItem('taches', JSON.stringify(v)));
					this.$watch('darkMode', v => localStorage.setItem('theme', v ? 'dark' : 'light'));
					this.$watch('dyslexie', v => localStorage.setItem('dyslexie', v ? 'true' : 'false'));
				}
			}
		}

		function setCookie(name, value, days) {
			document.cookie = name + "=" + value + "; max-age=" + (days * 24 * 60 * 60) + "; path=/";
		}

		function getCookie(name) {
			const cookies = document.cookie.split('; ');
			for (const c of cookies) {
				const [n, v] = c.split('=');
				if (n === name) return v;
			}
			return null;
		}

		function deleteCookie(name) {
			document.cookie = name + "=; max-age=0; path=/";
		}
	</script>
	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
	<style>
		body { margin: 0; }
		.page { min-height: 100vh; padding: 1rem 2rem; }
		.dark {
			background: #1e1e1e;
			color: #f5f5f5;
		}
		.dyslexie {
			line-height: 1.8;
			letter-spacing: 0.05em;
			word-spacing: 0.12em;
		}
		.dyslexie p,
		.dyslexie li {
			max-width: 70ch;
			font-size: 1.08rem;
		}
	</style>
</head>
<body>
<div class="page" x-data="todoApp()" :class="{ dark: darkMode, dyslexie: dyslexie }">

	<h1>Ma Todo List</h1>

	<button @click="darkMode = !darkMode">Changer de thème</button>
	<button @click="dyslexie = !dyslexie">Lecture facilitée</button>
	<br><br>

	<input type="text" x-model="nouvelle" placeholder="Nouvelle tâche">
	<button @click="taches.push({ texte: nouvelle, faite: false }); nouvelle = ''">
		Ajouter
	</button>

	<ul>
		<template x-for="(t, i) in taches">
			<li>
				<input type="checkbox" x-model="t.faite">
				<span x-text="t.texte"></span>
				<button @click="taches.splice(i, 1)">Supprimer</button>
			</li>
		</template>
	</ul>

	<p>
		Total : <span x-text="taches.length"></span> |
		Faites : <span x-text="taches.filter(t => t.faite).length"></span>
	</p>

</div>
</body>
</html>
